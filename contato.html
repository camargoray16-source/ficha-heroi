<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato com a Guilda — Eliseu</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="header-principal">
    <div class="logo">
      <i class="fa-solid fa-compass-drafting"></i>
      <div>
        <span class="nome-logo">ELISEU</span>
        <span class="subtitulo-logo">Guardião da Aliança</span>
      </div>
    </div>

    <!-- Botão hambúrguer (visível só em telas pequenas) -->
    <button type="button" id="btn-menu" class="btn-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-nav">
      <i class="fa-solid fa-bars"></i>
    </button>

    <nav id="menu-nav" class="menu-navegacao">
      <a href="index.html#sobre" class="link-nav"><i class="fa-solid fa-house"></i> Início</a>
      <a href="index.html#atributos" class="link-nav"><i class="fa-solid fa-star"></i> Atributos</a>
      <a href="index.html#inventario" class="link-nav"><i class="fa-solid fa-bag-shopping"></i> Inventário</a>
      <a href="contato.html" class="link-nav ativo"><i class="fa-solid fa-users"></i> Contato com guilda</a>
    </nav>

    <div class="header-direita">
      <span id="saudacao" class="saudacao" aria-live="polite"></span>
      <button type="button" id="btn-tema" class="btn-tema" aria-pressed="false"><i class="fa-solid fa-moon"></i> <span>Modo noturno</span></button>
      <div class="citacao-topo">"A verdadeira força não está na espada, mas naquilo que guia o coração."</div>
    </div>
  </header>

  <main class="conteudo-principal">
    <section class="bloco-card card-moldura guilda-bloco">

      <h2><i class="fa-solid fa-paper-plane"></i> Contato com a Guilda</h2>
      <p class="guilda-sub">Envie uma mensagem direta ao Profeta Místico e à sua ordem.</p>

      <!-- novalidate: desliga a validação padrão do navegador; quem valida é o JavaScript -->
      <form id="form-guilda" class="form-guilda" action="https://formspree.io/f/mppdzrov" method="POST" novalidate>

        <div class="campo">
          <label for="nome">Seu Nome ou Título: <span class="obrig">*</span></label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Guerreiro de Galiléia" autocomplete="name" required>
          <small class="erro" id="erro-nome"></small>
        </div>

        <div class="campo">
          <label for="email">Seu E-mail: <span class="obrig">*</span></label>
          <input type="email" id="email" name="email" placeholder="seuemail@reino.com" autocomplete="email" required>
          <small class="erro" id="erro-email"></small>
        </div>

        <div class="campo">
          <label for="assunto">Assunto da Convocação: <span class="obrig">*</span></label>
          <select id="assunto" name="assunto" required>
            <option value="" disabled selected>Selecione uma opção...</option>
            <option value="Pedido de Cura">Pedido de Cura e Purificação</option>
            <option value="Proposta de Aliança">Proposta de Aliança entre Guildas</option>
            <option value="Aviso de Perigo">Aviso de Perigo Ameaçando o Reino</option>
            <option value="Solicitação de Recursos">Solicitação de Recursos e Mantimentos</option>
            <option value="Outro Assunto">Outro Assunto</option>
          </select>
          <small class="erro" id="erro-assunto"></small>
        </div>

        <div class="campo">
          <label for="mensagem">Sua Mensagem: <span class="obrig">*</span></label>
          <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva os detalhes da sua mensagem para o Guardião..." required></textarea>
          <small class="erro" id="erro-mensagem"></small>
        </div>

        <!-- Mensagem geral de sucesso / erro (sem alert) -->
        <p id="status-form" class="status-form" role="status" aria-live="polite"></p>

        <div class="botoes-formulario">
          <button type="submit" class="btn-guilda" id="btn-enviar">
            <i class="fa-solid fa-paper-plane"></i> Enviar Mensagem
          </button>
          <a href="index.html#guilda" class="btn-guilda-voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
          </a>
        </div>
      </form>
    </section>
  </main>

  <!-- RODAPÉ -->
  <footer class="rodape-principal">
    <p>✦ Juntos por um reino mais forte ✦ Guilda Eliseu ✦</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
